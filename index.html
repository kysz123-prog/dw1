<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덕원여고1 맞춤법 💚</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<main>
  <section id="start" class="view">
    <div class="card start">
      <div class="logo">💚</div>
      <h1>덕원여고1 맞춤법 💚</h1>
      <p class="lead">바른 표기를 고르고, 맞춤법이 틀린 것을 찾으세요.</p>
      <div id="resume" class="resume" hidden>
        <p id="resumeInfo"></p>
        <button id="btnResume" class="primary" type="button">이어서 풀기</button>
        <button id="btnDiscard" class="btn-text" type="button">버리고 새로 시작</button>
      </div>
      <label class="lbl">이름</label>
      <input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="off" maxlength="20">
      <p id="info" class="note"></p>
      <button id="go" class="primary" disabled>시작하기</button>
      <button id="btnNotes" class="btn-sub" type="button">📑 오답노트 (<span id="notesBadge">0</span>)</button>
    </div>
  </section>

  <section id="quiz" class="view" hidden>
    <header class="top">
      <span id="progress"></span>
      <div class="track"><i id="bar"></i></div>
      <span id="timer"></span>
    </header>
    <article id="sentence" class="card passage"></article>
    <div class="dock">
      <div class="dock-in">
        <div id="hint"></div>
        <div id="choices"></div>
        <div class="nav">
          <button id="prev">이전</button>
          <button id="next" class="primary" disabled>다음</button>
        </div>
      </div>
    </div>
  </section>

  <section id="result" class="view" hidden>
    <div id="suspense" class="card suspense">
      <div class="beat">💚</div>
      <p>두근두근… 채점 중</p>
    </div>
    <div id="reveal" hidden>
      <div class="card score-card">
        <img id="resultImg" alt="">
        <div id="verdict"></div>
        <div id="ring"><div id="score"></div></div>
        <p id="sub" class="note"></p>
      </div>
      <h2>조항별 결과</h2>
      <div id="hangTable" class="card"></div>
      <h2 id="wrongTitle">틀린 문제</h2>
      <div id="wrongList"></div>
      <button id="again" class="primary">다시 풀기</button>
      <button id="btnResultNotes" class="btn-sub" type="button">📑 오답노트 보러가기</button>
    </div>
  </section>

  <section id="notes" class="view" hidden>
    <div class="notes-header">
      <button id="btnNotesBack" class="btn-back" type="button">← 돌아가기</button>
      <h2>📑 내 오답노트</h2>
      <button id="btnClearNotes" class="btn-text" type="button">비우기</button>
    </div>
    <div id="notesList"></div>
  </section>
</main>
<script src="core.js?v=5"></script>
<script src="questions.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
